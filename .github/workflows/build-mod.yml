# Build jar trên runner của GitHub (có truy cập Fabric Maven, Mojang, Maven Central).
# Chạy: tab Actions -> "Build Spectre mod" -> Run workflow, hoặc tự chạy khi push zip.

name: Build Spectre mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'Spectre_1.21.4_full_source.zip'
      - 'Spectre_1.21.4_fixed_source.zip'
      - '.github/workflows/build-mod.yml'
      - '.github/scripts/dump-api.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          if [ -f Spectre_1.21.4_fixed_source.zip ]; then
            ZIP=Spectre_1.21.4_fixed_source.zip
          else
            ZIP=Spectre_1.21.4_full_source.zip
          fi
          echo "Using $ZIP"
          mkdir -p spectre
          unzip -q "$ZIP" -d spectre
          test -f spectre/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build mod jar
        working-directory: spectre
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Dump Minecraft API signatures (porting reference)
        if: always()
        continue-on-error: true
        run: bash .github/scripts/dump-api.sh

      - name: Upload mod jar (không kèm -sources)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spectre-mod-jar
          path: |
            spectre/build/libs/*.jar
            !spectre/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
